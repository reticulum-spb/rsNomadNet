[package]
name = "rs-nomadnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "A web client compatible with NomadNet"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "json"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
lxmf-core = { path = "../rsLXMF/crates/lxmf-core" }
rns-crypto = { path = "../rsReticulum/crates/rns-crypto" }
rns-identity = { path = "../rsReticulum/crates/rns-identity" }
rns-runtime = { path = "../rsReticulum/crates/rns-runtime" }
rns-transport = { path = "../rsReticulum/crates/rns-transport" }
rusqlite = { version = "0.32", features = ["bundled"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
rs-rrc-client = { path = "../rsRRC-client" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
