[package]
name = "rsNomadNet"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "A web client compatible with NomadNet"

[features]
default = ["reticulum-full", "web"]
web = ["dep:axum", "dep:tower-http"]
tui = ["dep:tvision-rs"]
reticulum-full = [
    "lxmf-core/reticulum-full",
    "rns-runtime/full",
    "rs-rrc-client/reticulum-full",
]
reticulum-client = [
    "lxmf-core/reticulum-client",
    "rns-runtime/client",
    "rs-rrc-client/reticulum-client",
]

[[bin]]
name = "nomadnet-rs"
path = "src/bin/web.rs"
required-features = ["web"]

[[bin]]
name = "nomadnet-tui"
path = "src/bin/tui.rs"
required-features = ["tui"]

[lib]
name = "rsnomadnet_core"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "json"], optional = true }
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
lxmf-core = { path = "../rsLXMF/crates/lxmf-core", default-features = false, features = ["sqlite-bundled"] }
rns-crypto = { path = "../rsReticulum/crates/rns-crypto" }
rns-identity = { path = "../rsReticulum/crates/rns-identity" }
rns-runtime = { path = "../rsReticulum/crates/rns-runtime", default-features = false }
rns-transport = { path = "../rsReticulum/crates/rns-transport" }
rns-wire = { path = "../rsReticulum/crates/rns-wire" }
rusqlite = { version = "0.32", features = ["bundled"] }
rmpv = "1"
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
rs-rrc-client = { path = "../rsRRC-client", default-features = false }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tvision-rs = { version = "=0.15.0", default-features = false, optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
